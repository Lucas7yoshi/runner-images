name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly, Monday 04:17 UTC — picks up .NET patches and OS updates
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lucas7yoshi/runner-dotnet

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: meta
        run: |
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build (load locally for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: runner-dotnet:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm -v "$PWD/smoke-test.sh:/smoke-test.sh:ro" runner-dotnet:test bash /smoke-test.sh

      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.date }}
          cache-from: type=gha
